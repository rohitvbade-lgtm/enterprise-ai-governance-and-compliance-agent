# Alembic configuration file.
# This file is read by `alembic` commands.

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# Leave empty for UTC
timezone = UTC

# sys.path addition — allow imports from project root
prepend_sys_path = .

# Version locations (single path here)
version_locations = %(here)s/migrations/versions

# Version path separator (os default)
version_path_separator = os

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# SQLAlchemy URL is injected at runtime from settings.py (see migrations/env.py)
# Do NOT hardcode credentials here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

